# srcs/requirements/bonus/ftp/conf/vsftpd.conf
# Minimal, Docker-friendly vsftpd configuration

listen=YES
listen_port=21

# Passive mode
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010
# entrypoint will replace this with the PASV_ADDRESS env var
pasv_address=__PASV_ADDRESS__

# Local users
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES
local_umask=022

# Security and noise reduction
anonymous_enable=NO
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
dual_log_enable=NO

# Performance
idle_session_timeout=600
data_connection_timeout=120

# Disable SSL here (plain FTP). Switch to YES and provide certs if you want FTPS.
ssl_enable=NO
