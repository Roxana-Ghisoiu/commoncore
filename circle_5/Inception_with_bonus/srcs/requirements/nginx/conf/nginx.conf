# ===============================
# NGINX CONFIG (MANDATORY + BONUS)
# ===============================

user  www-data;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # =========================================
    # MANDATORY PART — WordPress (PHP-FPM, TLS)
    # =========================================

    # Upstream to WordPress PHP-FPM (internal Docker name/port)
    upstream php-fpm {
        server wordpress:9000;
    }

    # ============================
    # BONUS — Static site proxying
    # ============================

    # Why: the static resume site runs in its own container (static_page) on port 8000.
    # We expose it under https://<domain>/resume/ via the main TLS nginx.
    upstream static_site {
        server static_page:8000;
    }

    # ============================
    # BONUS — Adminer proxying
    # ============================

    # Why: Adminer runs in its own container (adminer) on port 8080.
    # We expose it under https://<domain>/adminer/ via the main TLS nginx.
    upstream adminer_site {
        server adminer:8080;
    }

    # ---------------------------
    # SINGLE HTTPS SERVER (443)
    # Handles WordPress, /resume/ and /adminer/
    # ---------------------------
    server {
        listen              443 ssl http2;
        server_name         rghisoiu.42.fr;

        # Document root for WordPress
        root                /var/www/html;
        index               index.php index.html;

        # TLS settings (self-signed or your certs)
        ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # ---------------------------
        # BONUS: /resume/
        # Reverse proxy to the static_page container.
        # ^~ ensures this prefix wins over regex locations;
        # trailing slash in proxy_pass rewrites /resume/asset -> /asset.
        # ---------------------------
        location ^~ /resume/ {
            proxy_pass http://static_site/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---------------------------
        # BONUS: /adminer/
        # Reverse proxy to the adminer container.
        # ^~ ensures this prefix wins over regex locations;
        # trailing slash in proxy_pass rewrites /adminer/asset -> /asset.
        # ---------------------------
        location ^~ /adminer/ {
            proxy_pass http://adminer_site/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
        }

        # ---------------------------
        # BONUS: /portainer/
        # Reverse proxy to the portainer container under a subpath.
        # Uses X-Forwarded-Prefix and rewrites to strip the /portainer prefix.
        # ---------------------------
        location ^~ /portainer/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /portainer;

            rewrite ^/portainer(/.*)$ $1 break;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_redirect off;
            proxy_pass http://portainer:9000;
        }

        # ---------------------------
        # MANDATORY: WordPress front controller + PHP handling
        # ---------------------------
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            include        fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass   php-fpm;
        }

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
    }
}
